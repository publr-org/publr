name: check

# Every push: formatting and tidy, without building Publr. The full verify (verify.yml)
# runs in a Release, before anything is published.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { path: publr }
      - uses: ./publr/.github/actions/workspace

      - name: Formatting and tidy
        working-directory: publr
        run: zig build check --summary failures
