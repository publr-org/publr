name: Release

# Actions → Release → Run, choosing patch, minor or major. It releases main as it is: every
# gate check (verify.yml) runs beside the builds, and nothing is published unless it
# passes. The next version is built first; only then is its
# commit tagged and released, so a failed run leaves no tag or Release. The tag holds the
# commit tested plus the version commit, and is merged into main afterwards, so pushing to
# main while a release runs is fine.
#
# The kind must match the database (`.agents/specs/updates.md`): a patch has no migration,
# a minor's migration only adds, a one-way migration needs a major. The Linux x86_64 build
# makes the release's upgrade site and carries the lived site (both attached to the release,
# never committed), updates every earlier release's site with the release binary, and proves
# the previous minor still runs on the result.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: What kind of release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

env:
  GH_TOKEN: ${{ github.token }}
  # The versions written on a release; build.zig.zon is the one read.
  VERSION_FILES: build.zig.zon src/publr.zig src/operations/heartbeat.zig

jobs:
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.kind.outputs.previous }}
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { path: publr, fetch-depth: 0 }

      - name: The next version
        id: next
        working-directory: publr
        env:
          BUMP: "${{ inputs.bump }}"
          SIGNING_KEY: "${{ secrets.PUBLR_RELEASE_SIGNING_KEY }}"
          RELEASE_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::release from main, not $GITHUB_REF"; exit 1
          fi
          current="$(sed -nE 's/^ *\.version = "([0-9]+\.[0-9]+\.[0-9]+)",$/\1/p' build.zig.zon)"
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "::error::v$version already exists"; exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::secret PUBLR_RELEASE_SIGNING_KEY is not set: releases must be signed"; exit 1
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::secret RELEASE_TOKEN is not set: the tag and main are pushed with it"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing \`v$version\` ($BUMP from $current) from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # Patch: no migration. Minor: one that only adds. Major: may be one-way.
      - name: The kind matches the database
        id: kind
        working-directory: publr
        env:
          BUMP: "${{ inputs.bump }}"
          VERSION: "${{ steps.next.outputs.version }}"
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          migration=src/lib/db/migrations/unreleased.zig
          unreleased=false; one_way=false; schema_changed=false
          # Migrations are required only once update testing has started (fixtures/upgrade/START).
          if [ -f fixtures/upgrade/START ]; then
            [ -f "$migration" ] && unreleased=true
            if $unreleased && grep -q 'pub const one_way = true' "$migration"; then one_way=true; fi
            if [ -n "$last" ] && ! git diff --quiet "$last" -- src/lib/db/schema.sql; then
              schema_changed=true
            fi
          fi
          if $schema_changed && ! $unreleased; then
            echo "::error::schema.sql changed since $last with no $migration; run zig build migration-draft"; exit 1
          fi
          case "$BUMP" in
            patch) if $unreleased; then
                     echo "::error::a patch carries no migration; release a minor"; exit 1
                   fi ;;
            minor) if $one_way; then
                     echo "::error::the migration is one-way: that is a major"; exit 1
                   fi
                   if ! $unreleased; then
                     echo "::warning::a minor without a migration: usually a patch"
                   fi ;;
          esac
          IFS=. read -r major minor patch <<< "$VERSION"
          previous="$(git tag -l 'v*' | sed 's/^v//' | sort -V | awk -F. -v major="$major" -v minor="$minor" \
            '$1 < major || ($1 == major && $2 < minor) { latest = $0 } END { if (latest) print "v" latest }')"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Migration: $unreleased (one-way: $one_way). Step back tested against: ${previous:-none}" >> "$GITHUB_STEP_SUMMARY"

      # The libraries as they are now, the same for every build and kept with the Release
      # (workspace.txt), so whatever builds this release later builds it with them.
      - name: The libraries' commits
        id: commits
        run: |
          {
            echo "commits<<EOF"
            for pair in lib:lib pjsx:pjsx jit:jit ui:ui icons:icons publr-js:publrjs editor:editor; do
              commit="$(git ls-remote "https://github.com/publr-org/${pair#*:}.git" refs/heads/main | cut -f1)"
              [ -n "$commit" ] || { echo "::error::no main in ${pair#*:}" >&2; exit 1; }
              echo "${pair%%:*} $commit"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # Before anything is built for release, with a plain Debug binary (the quickest to make):
  # this version's fixture, the lived site carried on, every earlier fixture updated, and
  # the previous minor running on the result. A release that would break a site's database
  # builds nothing.
  upgrade:
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2604
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { path: publr, fetch-depth: 0 }

      # The version, and the next migration named by it before anything is built: a
      # released binary never records a migration as `unreleased`.
      - name: Write the version
        working-directory: publr
        run: &write_version |
          perl -pi -e 's/^(\s*\.version|pub const version) = "\d+\.\d+\.\d+"/$1 = "$ENV{VERSION}"/' $VERSION_FILES
          for file in $VERSION_FILES; do
            grep -q "version = \"$VERSION\"" "$file" || { echo "::error file=$file::no version line"; exit 1; }
          done
          migrations=src/lib/db/migrations
          if [ -f fixtures/upgrade/START ] && [ -f "$migrations/unreleased.zig" ]; then
            mv "$migrations/unreleased.zig" "$migrations/$VERSION.zig"
            # The entry that imports unreleased.zig takes the version as its name, whether it
            # spelled it "unreleased" or migration.unreleased.
            perl -0pi -e 's/(\.of\(\s*"[^"]+",\s*)(?:migration\.unreleased|"unreleased")(,\s*\@import\("migrations\/unreleased\.zig"\))/$1"$ENV{VERSION}"$2/; s/migrations\/unreleased\.zig/migrations\/$ENV{VERSION}.zig/g' "$migrations.zig"
            grep -q "migrations/$VERSION.zig" "$migrations.zig" || { echo "::error::$migrations.zig does not list unreleased.zig"; exit 1; }
            perl -0ne 'exit 1 unless /\.of\(\s*"[^"]+",\s*"\Q$ENV{VERSION}\E",\s*\@import\("migrations\/\Q$ENV{VERSION}\E\.zig"\)/' "$migrations.zig" \
              || { echo "::error::$migrations.zig does not name the entry for $VERSION.zig \"$VERSION\""; exit 1; }
          fi
          # With no unreleased.zig, no entry may still be named unreleased: a released binary
          # would record its migration so.
          if [ ! -f "$migrations/unreleased.zig" ] && \
             ! perl -0ne 'exit 1 if /\.of\(\s*"[^"]+",\s*(?:migration\.unreleased|"unreleased")\s*,/' "$migrations.zig"; then
            echo "::error::$migrations.zig names an entry unreleased, and there is no unreleased.zig"; exit 1
          fi

      - uses: ./publr/.github/actions/workspace
        with:
          commits: ${{ needs.version.outputs.commits }}

      - uses: ./publr/.github/actions/upgrade-sites

      - name: Upgrade fixtures and tests
        working-directory: publr
        env: { PREVIOUS: "${{ needs.version.outputs.previous }}" }
        run: |
          zig build --prefix ../out
          binary="$PWD/../out/bin/publr"
          test "$("$binary" --version)" = "publr $VERSION"
          previous_binary=""
          if [ -n "$PREVIOUS" ]; then
            mkdir -p ../previous
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir ../previous \
              --pattern publr-linux-x86_64 --pattern SHA256SUMS
            (cd ../previous && grep ' publr-linux-x86_64$' SHA256SUMS | sha256sum -c -)
            chmod +x ../previous/publr-linux-x86_64
            previous_binary="$PWD/../previous/publr-linux-x86_64"
          fi
          # Fixtures are made only once update testing has started (fixtures/upgrade/START).
          # This release's site and the lived site carried on to it become release assets.
          mkdir -p ../upgrade-sites
          if [ -f fixtures/upgrade/START ]; then
            zig build upgrade-fixture -Dupgrade-binary="$binary"
            cp ".zig-cache/upgrade-sites/$VERSION.tar.gz" "../upgrade-sites/upgrade-$VERSION.tar.gz"
            cp .zig-cache/upgrade-sites/lived.tar.gz ../upgrade-sites/upgrade-lived.tar.gz
          fi
          zig build upgrade -Dupgrade-binary="$binary" -Dupgrade-previous="$previous_binary" \
            2>&1 | tee ../upgrade.txt
          test "${PIPESTATUS[0]}" -eq 0

      # What this release offers plugins and apps (`scripts/surface.zig`), against the previous
      # release's: nothing past its removal day still here, nothing gone that was not
      # deprecated until its day. The surface and the migration prompt become assets; the
      # first release with no previous surface compares nothing.
      - name: Surface and migration prompt
        working-directory: publr
        env: { PREVIOUS: "${{ needs.version.outputs.previous }}" }
        run: |
          mkdir -p ../surface ../surface-previous
          zig build surface -- write ../out/bin/publr ../surface/surface.json
          previous=-
          if [ -n "$PREVIOUS" ] && gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" \
            --dir ../surface-previous --pattern surface.json 2>/dev/null; then
            previous=../surface-previous/surface.json
          fi
          zig build surface -- check ../surface/surface.json "$previous" "$(date -u +%F)" BREAKING.md
          zig build surface -- prompt ../surface/surface.json "$previous" BREAKING.md \
            > ../surface/migration.md
          cat ../surface/migration.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade
          path: |
            upgrade-sites/*.tar.gz
            upgrade.txt
            surface/surface.json
            surface/migration.md

  # WAMR's macOS headers come from the system SDK, so each macOS binary is built on its own
  # kind of CPU (for any CPU of that kind: baseline), for a stated macOS: a native build would
  # require the build machine's own version. Blacksmith's Macs are Apple silicon. Linux is
  # cross-compiled against musl.
  build:
    needs: [version, upgrade]
    strategy:
      matrix:
        include:
          - { runner: blacksmith-4vcpu-ubuntu-2604, target: x86_64-linux-musl, file: publr-linux-x86_64 }
          - { runner: blacksmith-4vcpu-ubuntu-2604, target: aarch64-linux-musl, file: publr-linux-aarch64 }
          - { runner: blacksmith-6vcpu-macos-15, target: aarch64-macos.15.0, file: publr-macos-aarch64 }
          - { runner: macos-15-intel, target: x86_64-macos.15.0, file: publr-macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { path: publr, fetch-depth: 0 }

      - name: Write the version
        working-directory: publr
        run: *write_version

      - uses: ./publr/.github/actions/workspace
        with:
          commits: ${{ needs.version.outputs.commits }}

      # The compiler peaks above the Linux runner's 16 GB on aarch64 (17.4 GB measured for
      # 0.8.0): swap on the runner's spare disk keeps it from being killed.
      - name: More swap
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -g

      - name: zig build
        working-directory: publr
        run: |
          zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=safe \
            --prefix ../out
          cp ../out/bin/publr ../${{ matrix.file }}

      - name: Check it reports the version
        if: matrix.target != 'aarch64-linux-musl'
        run: test "$(./${{ matrix.file }} --version)" = "publr $VERSION"

      # Built for its own CPU, opening on macOS 15 and later: the version check above runs an
      # arm64 build happily on an Apple silicon runner, whatever its name says.
      - name: Its CPU and oldest macOS
        if: runner.os == 'macOS'
        run: |
          if [[ "${{ matrix.file }}" == *aarch64 ]]; then arch=arm64; else arch=x86_64; fi
          file -b "./${{ matrix.file }}" | grep -q "$arch" || { echo "::error::not $arch"; exit 1; }
          minos=$(vtool -show-build "./${{ matrix.file }}" | awk '/minos/ { print $2 }')
          [ "$minos" = 15.0 ] || { echo "::error::needs macOS $minos, not 15.0"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "${{ matrix.file }}", path: "${{ matrix.file }}" }

  verify:
    needs: version
    uses: ./.github/workflows/verify.yml

  release:
    needs: [version, upgrade, build, verify]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      # Pushed with a token that may write workflows: the default one may not push a tag or
      # merge whose workflow files differ from main's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { path: publr, fetch-depth: 0, token: "${{ secrets.RELEASE_TOKEN }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, pattern: "publr-*", merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: upgrade, name: upgrade }

      - name: Write the version
        working-directory: publr
        run: *write_version

      - name: Checksums
        working-directory: dist
        env: { COMMITS: "${{ needs.version.outputs.commits }}" }
        run: |
          printf '%s\n' "$COMMITS" > workspace.txt
          chmod +x publr-*
          sha256sum publr-* workspace.txt > SHA256SUMS
          for file in publr-*; do sha256sum "$file" > "$file.sha256"; done
          cat SHA256SUMS

      # `publr update` trusts SHA256SUMS only with this signature, checked against the
      # public key compiled into every release (src/server/update/key.zig).
      - name: Sign
        working-directory: dist
        env: { SIGNING_KEY: "${{ secrets.PUBLR_RELEASE_SIGNING_KEY }}" }
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::secret PUBLR_RELEASE_SIGNING_KEY is not set: releases must be signed"; exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > ../signing.pem
          openssl pkeyutl -sign -inkey ../signing.pem -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm ../signing.pem
          test "$(wc -c < SHA256SUMS.sig)" -eq 64

      # The version and the migration it named go in its own commit, and the tag holds it.
      # Only the tag is pushed: main may have moved since the commit tested, and it takes the
      # release afterwards.
      - name: Commit the version and tag it
        working-directory: publr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Before 1.0, what this release broke becomes its own section of BREAKING.md, under
          # a new, empty Unreleased.
          if [ -f BREAKING.md ]; then
            grep -qx '## Unreleased' BREAKING.md || { echo "::error::BREAKING.md has no ## Unreleased"; exit 1; }
            DAY="$(date -u +%F)" perl -0pi -e \
              's/^## Unreleased$/## Unreleased\n\n## $ENV{VERSION} ($ENV{DAY})/m' BREAKING.md
          fi
          # The folder, not src/lib/db/migrations: it is not there until the first migration.
          git add -A src/lib/db
          git commit -qam "Release $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      # The notes as React writes its own: the version and its date as the title, the beta line,
      # every change since the previous release with its commit, and the full changelog.
      - name: Release notes
        working-directory: publr
        env: { BETA: "Publr is in beta: expect changes between releases." }
        run: |
          previous="$(git tag --list 'v*' --sort=-version:refname | grep -vx "$TAG" | head -1)"
          changes() {
            git log --reverse --no-merges --format='%h%x09%H%x09%s' "$previous..$TAG" |
              while IFS="$(printf '\t')" read -r short long subject; do
                case "$subject" in "Release v"*|"Merge "*) continue ;; esac
                echo "- $subject ([$short]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$long))"
              done
          }
          {
            printf '%s\n\n' "$BETA"
            if [ -z "$previous" ]; then
              echo "First release."
            else
              printf '## All changes\n\n%s\n\n' "$(changes)"
              echo "**Full changelog:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
            # What this release broke (its section of BREAKING.md), when anything.
            if [ -f BREAKING.md ]; then
              broke="$(awk -v head="## $VERSION " 'index($0, head) == 1 { on = 1; next }
                /^## / { on = 0 } on' BREAKING.md)"
              if printf '%s\n' "$broke" | grep -q '^### '; then
                printf '\n## Breaking changes\n%s\n' "$broke"
              fi
            fi
            # What plugins and apps must change, when anything (surface.zig prompt); the same
            # text is the migration.md asset agents read.
            if [ -f ../upgrade/surface/migration.md ] && grep -q '^## ' ../upgrade/surface/migration.md; then
              printf '\n## For plugins and apps\n%s\n' "$(sed -e 1d -e 's/^## /### /' ../upgrade/surface/migration.md)"
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "$VERSION ($(date -u '+%B %-d, %Y'))" > "$RUNNER_TEMP/title.txt"
          cat "$RUNNER_TEMP/title.txt" "$RUNNER_TEMP/notes.md"

      - name: Release
        run: |
          # This release's upgrade site and the lived site are its assets, never repository
          # files: the next releases' upgrade tests fetch them (.github/actions/upgrade-sites).
          gh release create "$TAG" dist/* $(ls upgrade/upgrade-sites/*.tar.gz 2>/dev/null) \
            $(ls upgrade/surface/surface.json upgrade/surface/migration.md 2>/dev/null) \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$(cat "$RUNNER_TEMP/title.txt")" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # Main takes the release: a fast-forward when nothing was pushed meanwhile, else a
      # merge, so the tag stays in main's history (the next release finds it there).
      - name: Merge the release into main
        working-directory: publr
        run: |
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            if ! git merge -q --no-edit -m "Merge $TAG into main" "$TAG"; then
              echo "::error::$TAG is released, but main changed the same lines: merge $TAG into main by hand"
              exit 1
            fi
            git push origin main && exit 0
          done
          echo "::error::$TAG is released, but main kept moving: merge $TAG into main by hand"
          exit 1
