name: Release

# Actions → Release → Run, choosing patch, minor or major. It releases main as it is: every
# gate check (verify.yml) runs beside the builds, and nothing is published unless it
# passes. The next version is built first; only then is its
# commit tagged and released, so a failed run leaves no tag or Release. The tag holds the
# commit tested plus the version commit, and is merged into main afterwards, so pushing to
# main while a release runs is fine.
#
# The kind must match the database (`.agents/specs/updates.md`): a patch has no migration,
# a minor's migration only adds, a one-way migration needs a major. The Linux x86_64 build
# makes the release's upgrade site and carries the lived site (both attached to the release,
# never committed), updates every earlier release's site with the release binary, and proves
# the previous minor still runs on the result.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: What kind of release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

env:
  GH_TOKEN: ${{ github.token }}
  # The versions written on a release; build.zig.zon is the one read.
  VERSION_FILES: build.zig.zon src/publr.zig src/operations/heartbeat.zig

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.kind.outputs.previous }}
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with: { path: publr, fetch-depth: 0 }

      - name: The next version
        id: next
        working-directory: publr
        env:
          BUMP: "${{ inputs.bump }}"
          SIGNING_KEY: "${{ secrets.PUBLR_RELEASE_SIGNING_KEY }}"
          RELEASE_TOKEN: "${{ secrets.RELEASE_TOKEN }}"
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::release from main, not $GITHUB_REF"; exit 1
          fi
          current="$(sed -nE 's/^ *\.version = "([0-9]+\.[0-9]+\.[0-9]+)",$/\1/p' build.zig.zon)"
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "::error::v$version already exists"; exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::secret PUBLR_RELEASE_SIGNING_KEY is not set: releases must be signed"; exit 1
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::secret RELEASE_TOKEN is not set: the tag and main are pushed with it"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing \`v$version\` ($BUMP from $current) from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # Patch: no migration. Minor: one that only adds. Major: may be one-way.
      - name: The kind matches the database
        id: kind
        working-directory: publr
        env:
          BUMP: "${{ inputs.bump }}"
          VERSION: "${{ steps.next.outputs.version }}"
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          migration=src/lib/db/migrations/unreleased.zig
          unreleased=false; one_way=false; schema_changed=false
          [ -f "$migration" ] && unreleased=true
          if $unreleased && grep -q 'pub const one_way = true' "$migration"; then one_way=true; fi
          if [ -n "$last" ] && ! git diff --quiet "$last" -- src/lib/db/schema.sql; then
            schema_changed=true
          fi
          if $schema_changed && ! $unreleased; then
            echo "::error::schema.sql changed since $last with no $migration; run zig build migration-draft"; exit 1
          fi
          case "$BUMP" in
            patch) if $unreleased; then
                     echo "::error::a patch carries no migration; release a minor"; exit 1
                   fi ;;
            minor) if $one_way; then
                     echo "::error::the migration is one-way: that is a major"; exit 1
                   fi
                   if ! $unreleased; then
                     echo "::warning::a minor without a migration: usually a patch"
                   fi ;;
          esac
          IFS=. read -r major minor patch <<< "$VERSION"
          previous="$(git tag -l 'v*' | sed 's/^v//' | sort -V | awk -F. -v major="$major" -v minor="$minor" \
            '$1 < major || ($1 == major && $2 < minor) { latest = $0 } END { if (latest) print "v" latest }')"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Migration: $unreleased (one-way: $one_way). Step back tested against: ${previous:-none}" >> "$GITHUB_STEP_SUMMARY"

      # The libraries as they are now, the same for every build and kept with the Release
      # (workspace.txt), so whatever builds this release later builds it with them.
      - name: The libraries' commits
        id: commits
        run: |
          {
            echo "commits<<EOF"
            for pair in lib:lib pjsx:pjsx jit:jit ui:ui icons:icons publr-js:publrjs editor:editor; do
              commit="$(git ls-remote "https://github.com/publr-org/${pair#*:}.git" refs/heads/main | cut -f1)"
              [ -n "$commit" ] || { echo "::error::no main in ${pair#*:}" >&2; exit 1; }
              echo "${pair%%:*} $commit"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # Before anything is built for release, with a plain Debug binary (the quickest to make):
  # this version's fixture, the lived site carried on, every earlier fixture updated, and
  # the previous minor running on the result. A release that would break a site's database
  # builds nothing.
  upgrade:
    needs: version
    runs-on: ubuntu-latest
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { path: publr, fetch-depth: 0 }

      # The version, and the next migration named by it before anything is built: a
      # released binary never records a migration as `unreleased`.
      - name: Write the version
        working-directory: publr
        run: &write_version |
          perl -pi -e 's/^(\s*\.version|pub const version) = "\d+\.\d+\.\d+"/$1 = "$ENV{VERSION}"/' $VERSION_FILES
          for file in $VERSION_FILES; do
            grep -q "version = \"$VERSION\"" "$file" || { echo "::error file=$file::no version line"; exit 1; }
          done
          migrations=src/lib/db/migrations
          if [ -f "$migrations/unreleased.zig" ]; then
            mv "$migrations/unreleased.zig" "$migrations/$VERSION.zig"
            perl -pi -e 's/"unreleased"/"$ENV{VERSION}"/; s/migrations\/unreleased\.zig/migrations\/$ENV{VERSION}.zig/g' "$migrations.zig"
            grep -q "migrations/$VERSION.zig" "$migrations.zig" || { echo "::error::$migrations.zig does not list unreleased.zig"; exit 1; }
          fi

      - uses: ./publr/.github/actions/workspace
        with:
          commits: ${{ needs.version.outputs.commits }}

      - uses: ./publr/.github/actions/upgrade-sites

      - name: Upgrade fixtures and tests
        working-directory: publr
        env: { PREVIOUS: "${{ needs.version.outputs.previous }}" }
        run: |
          zig build -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" --prefix ../out
          binary="$PWD/../out/bin/publr"
          test "$("$binary" --version)" = "publr $VERSION"
          previous_binary=""
          if [ -n "$PREVIOUS" ]; then
            mkdir -p ../previous
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir ../previous \
              --pattern publr-linux-x86_64 --pattern SHA256SUMS
            (cd ../previous && grep ' publr-linux-x86_64$' SHA256SUMS | sha256sum -c -)
            chmod +x ../previous/publr-linux-x86_64
            previous_binary="$PWD/../previous/publr-linux-x86_64"
          fi
          # Fixtures are made only once update testing has started (fixtures/upgrade/START).
          # This release's site and the lived site carried on to it become release assets.
          mkdir -p ../upgrade-sites
          if [ -f fixtures/upgrade/START ]; then
            zig build upgrade-fixture -Dupgrade-binary="$binary" \
              -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE"
            cp ".zig-cache/upgrade-sites/$VERSION.tar.gz" "../upgrade-sites/upgrade-$VERSION.tar.gz"
            cp .zig-cache/upgrade-sites/lived.tar.gz ../upgrade-sites/upgrade-lived.tar.gz
          fi
          zig build upgrade -Dupgrade-binary="$binary" -Dupgrade-previous="$previous_binary" \
            -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" 2>&1 | tee ../upgrade.txt
          test "${PIPESTATUS[0]}" -eq 0

      - uses: actions/upload-artifact@v4
        with:
          name: upgrade
          path: |
            upgrade-sites/*.tar.gz
            upgrade.txt

  # WAMR's macOS headers come from the system SDK, so each macOS binary is built on its own
  # kind of CPU (for any CPU of that kind: baseline). Linux is cross-compiled against musl.
  build:
    needs: [version, upgrade]
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-linux-musl, file: publr-linux-x86_64 }
          - { runner: ubuntu-latest, target: aarch64-linux-musl, file: publr-linux-aarch64 }
          - { runner: macos-latest, target: native, file: publr-macos-aarch64 }
          - { runner: macos-15-intel, target: native, file: publr-macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { path: publr, fetch-depth: 0 }

      - name: Write the version
        working-directory: publr
        run: *write_version

      - uses: ./publr/.github/actions/workspace
        with:
          target: ${{ matrix.target }}
          commits: ${{ needs.version.outputs.commits }}

      - name: zig build
        working-directory: publr
        run: |
          zig build -Dtarget=${{ matrix.target }} -Dcpu=baseline -Doptimize=ReleaseSafe \
            -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" --prefix ../out
          cp ../out/bin/publr ../${{ matrix.file }}

      - name: Check it reports the version
        if: matrix.target != 'aarch64-linux-musl'
        run: test "$(./${{ matrix.file }} --version)" = "publr $VERSION"

      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.file }}", path: "${{ matrix.file }}" }

  verify:
    needs: version
    uses: ./.github/workflows/verify.yml

  release:
    needs: [version, upgrade, build, verify]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      # Pushed with a token that may write workflows: the default one may not push a tag or
      # merge whose workflow files differ from main's.
      - uses: actions/checkout@v4
        with: { path: publr, fetch-depth: 0, token: "${{ secrets.RELEASE_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "publr-*", merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { path: upgrade, name: upgrade }

      - name: Write the version
        working-directory: publr
        run: *write_version

      - name: Checksums
        working-directory: dist
        env: { COMMITS: "${{ needs.version.outputs.commits }}" }
        run: |
          cp ../publr/install.sh .
          printf '%s\n' "$COMMITS" > workspace.txt
          chmod +x publr-*
          sha256sum publr-* install.sh workspace.txt > SHA256SUMS
          for file in publr-*; do sha256sum "$file" > "$file.sha256"; done
          cat SHA256SUMS

      # `publr update` trusts SHA256SUMS only with this signature, checked against the
      # public key compiled into every release (src/server/update/key.zig).
      - name: Sign
        working-directory: dist
        env: { SIGNING_KEY: "${{ secrets.PUBLR_RELEASE_SIGNING_KEY }}" }
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::secret PUBLR_RELEASE_SIGNING_KEY is not set: releases must be signed"; exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > ../signing.pem
          openssl pkeyutl -sign -inkey ../signing.pem -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm ../signing.pem
          test "$(wc -c < SHA256SUMS.sig)" -eq 64

      # The version and the migration it named go in its own commit, and the tag holds it.
      # Only the tag is pushed: main may have moved since the commit tested, and it takes the
      # release afterwards.
      - name: Commit the version and tag it
        working-directory: publr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/lib/db/migrations src/lib/db/migrations.zig
          git commit -qam "Release $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Release
        run: |
          cat > notes.md <<EOF
          Download \`publr\` for your OS and CPU below, or install it with
          \`curl -fsSL https://raw.githubusercontent.com/publr-org/publr/$TAG/install.sh | sh\`.
          Each binary has its SHA-256 next to it, and \`SHA256SUMS\` lists every file.

          macOS builds are not signed yet. If macOS refuses to open \`publr\`, run
          \`xattr -d com.apple.quarantine publr\` once.

          ## Updating

          A running Publr updates from Settings › Updates, or \`publr update\`. Every update
          backs the whole site up first. Every earlier release since 0.3.0 was updated to
          this one before it shipped:

          \`\`\`
          $(grep -E '^(upgrade to|  |[0-9]+ passed)' upgrade/upgrade.txt || true)
          \`\`\`
          EOF
          # This release's upgrade site and the lived site are its assets, never repository
          # files: the next releases' upgrade tests fetch them (.github/actions/upgrade-sites).
          gh release create "$TAG" dist/* $(ls upgrade/upgrade-sites/*.tar.gz 2>/dev/null) \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes

      # Main takes the release: a fast-forward when nothing was pushed meanwhile, else a
      # merge, so the tag stays in main's history (the next release finds it there).
      - name: Merge the release into main
        working-directory: publr
        run: |
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            if ! git merge -q --no-edit -m "Merge $TAG into main" "$TAG"; then
              echo "::error::$TAG is released, but main changed the same lines: merge $TAG into main by hand"
              exit 1
            fi
            git push origin main && exit 0
          done
          echo "::error::$TAG is released, but main kept moving: merge $TAG into main by hand"
          exit 1
