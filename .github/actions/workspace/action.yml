name: Publr workspace
description: >
  The sibling repositories Publr builds against, checked out beside the caller's own
  (latest main of each), the PublrJS runtime built with Vite+, Zig, and the compiler Publr
  carries, built once per target and Zig and kept in the Actions cache. `commits` names the
  commit to take of any of them instead (a Publr release's workspace.txt). The caller checks
  out its own repository, and publr when it builds on it, into $GITHUB_WORKSPACE/<name>,
  and passes -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" to zig build.

inputs:
  target:
    description: The target publr is built for, which the carried compiler runs on
    default: native
  commits:
    description: Lines of `<folder> <commit>` (lib, pjsx, jit, ui, icons, publr-js); main otherwise
    default: ""

runs:
  using: composite
  steps:
    - id: refs
      shell: bash
      env: { COMMITS: "${{ inputs.commits }}" }
      run: |
        for folder in lib pjsx jit ui icons publr-js; do
          commit="$(printf '%s\n' "$COMMITS" | awk -v folder="$folder" '$1 == folder { print $2 }')"
          echo "${folder//-/_}=$commit" >> "$GITHUB_OUTPUT"
        done

    - uses: actions/checkout@v4
      with: { repository: publr-org/lib, path: lib, ref: "${{ steps.refs.outputs.lib }}" }
    - uses: actions/checkout@v4
      with: { repository: publr-org/pjsx, path: pjsx, ref: "${{ steps.refs.outputs.pjsx }}" }
    - uses: actions/checkout@v4
      with: { repository: publr-org/jit, path: jit, ref: "${{ steps.refs.outputs.jit }}" }
    - uses: actions/checkout@v4
      with: { repository: publr-org/ui, path: ui, ref: "${{ steps.refs.outputs.ui }}" }
    - uses: actions/checkout@v4
      with: { repository: publr-org/icons, path: icons, ref: "${{ steps.refs.outputs.icons }}" }
    - uses: actions/checkout@v4
      with:
        repository: publr-org/publrjs
        path: publr-js
        ref: "${{ steps.refs.outputs.publr_js }}"

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: publr-js/package-lock.json
    - name: Build the PublrJS runtime
      shell: bash
      working-directory: publr-js
      run: npm ci && npx vp build

    # Its own cache saves Zig's cache folders on every run (hundreds of MB each), which
    # would push the carried compiler out of the repository's 10 GB.
    - uses: mlugg/setup-zig@v2
      with: { version: 0.16.0, use-cache: false }

    # Building the carried compiler takes minutes, so it is built only when Zig or the way
    # lib/zig packs it changes (the key), and saved at once so a later failure keeps it.
    - id: toolchain
      uses: actions/cache/restore@v4
      with:
        path: zig-toolchain/toolchain.tar.gz
        key: >-
          zig-toolchain-baseline-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{
          hashFiles('lib/zig/build/**', 'lib/zig/build.zig.zon', 'publr/.zigversion') }}
    - name: Build the carried compiler
      if: steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      working-directory: lib/zig
      # For any CPU of the kind, not the one that built it: the cache moves between machines.
      # Zig declares 8 GB for building itself; it peaks near 2 GB, and macos-latest has 7.
      run: |
        zig build toolchain -Dtarget=${{ inputs.target }} -Dcpu=baseline --maxrss 8000000000 \
          --prefix "$GITHUB_WORKSPACE/zig-toolchain"
    - if: steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: zig-toolchain/toolchain.tar.gz
        key: ${{ steps.toolchain.outputs.cache-primary-key }}
    - name: Use it
      shell: bash
      run: |
        echo "PUBLR_TOOLCHAIN_ARCHIVE=$GITHUB_WORKSPACE/zig-toolchain/toolchain.tar.gz" >> "$GITHUB_ENV"

    - name: Record what was built
      shell: bash
      run: |
        echo "| repository | commit |" >> "$GITHUB_STEP_SUMMARY"
        echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
        for dir in */; do
          if [ -d "$dir/.git" ]; then
            echo "| ${dir%/} | \`$(git -C "$dir" rev-parse --short HEAD)\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
