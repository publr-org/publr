name: verify

# Every gate check, run by a Release before it publishes (release.yml), or by hand.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      # Every tag: the upgrade tests compare each released migration with it, and fetch each
      # release's upgrade site.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { path: publr, fetch-depth: 0 }
      - uses: ./publr/.github/actions/workspace

      # verify-full's checks, one step each, quickest first: the first failure ends the run.
      - name: Formatting, tidy and core's tests
        working-directory: publr
        run: zig build verify --summary failures
      - name: Every test
        working-directory: publr
        run: zig build test --summary failures
      - name: WebAssembly build
        working-directory: publr
        run: zig build wasm --summary failures
      - name: Fixture plugins sandboxed and compiled in
        working-directory: publr
        run: zig build two-mode --summary failures
      - name: Smoke
        working-directory: publr
        run: zig build smoke --summary failures
      - name: Printed examples
        working-directory: publr
        run: zig build parity --summary failures
      - uses: ./publr/.github/actions/upgrade-sites
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Upgrades from every release
        working-directory: publr
        run: zig build upgrade --summary failures
      - name: Browser build
        working-directory: publr
        run: zig build browser --summary failures
