name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Every tag: the upgrade tests compare each released fixture and migration with it.
      - uses: actions/checkout@v4
        with: { path: publr, fetch-depth: 0 }
      - uses: ./publr/.github/actions/workspace

      - name: zig build verify-full
        working-directory: publr
        run: zig build verify-full -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" --summary all
