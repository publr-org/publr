name: Release

# Actions → Release → Run, choosing patch, minor or major. The next version is checked and
# built first; only then is it committed to main, tagged and released, so a failed run
# leaves no commit, tag or Release behind.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: What kind of release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

env:
  GH_TOKEN: ${{ github.token }}
  # The versions written on a release; build.zig.zon is the one read.
  VERSION_FILES: build.zig.zon src/publr.zig src/operations/heartbeat.zig

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { path: publr }

      - name: The next version
        id: next
        working-directory: publr
        env: { BUMP: "${{ inputs.bump }}" }
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::release from main, not $GITHUB_REF"; exit 1
          fi
          current="$(sed -nE 's/^ *\.version = "([0-9]+\.[0-9]+\.[0-9]+)",$/\1/p' build.zig.zon)"
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            echo "::error::v$version already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing \`v$version\` ($BUMP from $current) from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: version
    runs-on: ubuntu-latest
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { path: publr }

      - name: Write the version
        working-directory: publr
        run: &write_version |
          perl -pi -e 's/^(\s*\.version|pub const version) = "\d+\.\d+\.\d+"/$1 = "$ENV{VERSION}"/' $VERSION_FILES
          for file in $VERSION_FILES; do
            grep -q "version = \"$VERSION\"" "$file" || { echo "::error file=$file::no version line"; exit 1; }
          done

      - uses: ./publr/.github/actions/workspace

      - name: zig build verify-full
        working-directory: publr
        run: zig build verify-full -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" --summary all

  # WAMR's macOS headers come from the system SDK, so each macOS binary is built on its own
  # CPU. Linux is cross-compiled against musl.
  build:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-linux-musl, file: publr-linux-x86_64 }
          - { runner: ubuntu-latest, target: aarch64-linux-musl, file: publr-linux-aarch64 }
          - { runner: macos-latest, target: native, file: publr-macos-aarch64 }
          - { runner: macos-15-intel, target: native, file: publr-macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    env: { VERSION: "${{ needs.version.outputs.version }}" }
    steps:
      - uses: actions/checkout@v4
        with: { path: publr }

      - name: Write the version
        working-directory: publr
        run: *write_version

      - uses: ./publr/.github/actions/workspace
        with: { target: "${{ matrix.target }}" }

      - name: zig build
        working-directory: publr
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe \
            -Dtoolchain-archive="$PUBLR_TOOLCHAIN_ARCHIVE" --prefix ../out
          cp ../out/bin/publr ../${{ matrix.file }}

      - name: Check it reports the version
        if: matrix.target != 'aarch64-linux-musl'
        run: test "$(./${{ matrix.file }} --version)" = "publr $VERSION"

      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.file }}", path: "${{ matrix.file }}" }

  release:
    needs: [version, verify, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { path: publr }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: Write the version
        working-directory: publr
        run: *write_version

      - name: Commit the version and tag it
        working-directory: publr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Checksums
        working-directory: dist
        run: |
          cp ../publr/install.sh .
          chmod +x publr-*
          sha256sum publr-* install.sh > SHA256SUMS
          for file in publr-*; do sha256sum "$file" > "$file.sha256"; done
          cat SHA256SUMS

      - name: Release
        run: |
          cat > notes.md <<EOF
          Download \`publr\` for your OS and CPU below, or install it with
          \`curl -fsSL https://raw.githubusercontent.com/publr-org/publr/$TAG/install.sh | sh\`.
          Each binary has its SHA-256 next to it, and \`SHA256SUMS\` lists every file.

          macOS builds are not signed yet. If macOS refuses to open \`publr\`, run
          \`xattr -d com.apple.quarantine publr\` once.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes
